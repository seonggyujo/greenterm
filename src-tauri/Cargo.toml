[package]
name = "greenterm"
version = "0.1.9"
description = "Green multi-pane terminal"
authors = ["seonggyujo"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "greenterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": child webviews for web panes (Window::add_child).
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
log = { version = "0.4", features = ["release_max_level_off"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# Same version Tauri uses: web pane focus events (src/web/focus.rs).
webview2-com = "0.38"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
