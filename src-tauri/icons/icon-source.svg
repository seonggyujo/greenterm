<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Heron app icon source: a watching eye in rings, the heron's beak as
       its pointer. Regenerate every size with:
       npm run tauri icon src-tauri/icons/icon-source.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b4334"/>
      <stop offset="1" stop-color="#101913"/>
    </linearGradient>
    <radialGradient id="eyeGlow">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#e6b450"/>
      <stop offset="1" stop-color="#e6b450" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Tile with a soft sage rim -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"
        stroke="#8fd8a8" stroke-opacity="0.35" stroke-width="20"/>

  <!-- Rings of the watching eye -->
  <path d="M512 232 A280 280 0 1 0 792 512" fill="none" stroke="#8fd8a8"
        stroke-width="44" stroke-linecap="round" opacity="0.45"/>
  <path d="M512 352 A160 160 0 1 0 672 512" fill="none" stroke="#8fd8a8"
        stroke-width="44" stroke-linecap="round" opacity="0.8"/>

  <!-- Beak -->
  <path d="M560 470 L930 512 L560 554 Z" fill="#c8f0d6"/>

  <!-- Eye, glowing like an agent's status light -->
  <circle cx="512" cy="512" r="110" fill="url(#eyeGlow)" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="58" fill="#ffd27a"/>
</svg>
